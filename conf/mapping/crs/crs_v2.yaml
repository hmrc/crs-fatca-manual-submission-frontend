root:
  name: CRS_OECD
  namespace: urn:oecd:ties:crs:v2

children:

  MessageSpec:

    children:

      MessageRefId:
        path: $.messageSpec.messageRefId

      ReportingPeriod:
        path: $.messageSpec.reportingYear

  ReportingFI:

    children:

      ResCountryCode:
        path: $.reportingFI.resCountryCode

      TIN:
        path: $.reportingFI.tin

      Name:
        path: $.reportingFI.name

  AccountReport:

    repeat: $.accounts[*]

    children:

      AccountNumber:
        path: $.accountNumber

      AccountBalance:
        path: $.accountBalance

      AccountHolder:

        children:

          Name:
            path: $.accountHolder.name

          ResCountryCode:
            path: $.accountHolder.countryCode